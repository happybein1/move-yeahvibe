<body>

    <!-- TOP BAR — workout screen only -->
    <div id="top-bar">
        <button class="change-btn" id="txt-change" onclick="clearMode()"></button>
        <a href="https://happybein.com" target="_blank" rel="noopener" class="hb-icon" aria-label="Happybein">
            <img src="images/happybein.png" alt="Happybein logo" width="28" height="28"/>
        </a>
        <div class="lang-group">
            <button id="btn-fr" class="lang-btn active" onclick="setLang('fr')" aria-label="Français">🇫🇷 FR</button>
            <button id="btn-en" class="lang-btn"        onclick="setLang('en')" aria-label="English">🇬🇧 EN</button>
        </div>
    </div>

    <!-- LANG SWITCHER — selection screen only -->
    <div id="lang-switcher-home">
        <a href="https://happybein.com" target="_blank" rel="noopener" class="hb-icon hb-icon-home" aria-label="Happybein">
            <img src="images/happybein.png" alt="Happybein logo" width="28" height="28"/>
        </a>
        <button id="btn-fr-home" class="lang-btn active" onclick="setLang('fr')" aria-label="Français">🇫🇷 FR</button>
        <button id="btn-en-home" class="lang-btn"        onclick="setLang('en')" aria-label="English">🇬🇧 EN</button>
    </div>

    <!-- SELECTION SCREEN -->
    <div id="selection-screen" role="main">
        <h1 id="txt-choose"></h1>
        <button class="mode-btn btn-intense" onclick="setMode('intense')" aria-label="Mode intense">
            <span class="mode-icon" aria-hidden="true">🔥</span>
            <span class="mode-title" id="txt-intense-title"></span>
            <span class="mode-desc"  id="txt-intense-desc"></span>
        </button>
        <button class="mode-btn btn-senior" onclick="setMode('senior')" aria-label="Mode senior">
            <span class="mode-icon" aria-hidden="true">🌿</span>
            <span class="mode-title" id="txt-senior-title"></span>
            <span class="mode-desc"  id="txt-senior-desc"></span>
        </button>
    </div>

    <!-- WORKOUT SCREEN -->
    <div id="workout-screen" role="main" aria-live="polite">
        <div id="card">
            <div class="emoji-display" id="emoji" aria-hidden="true">⚡</div>
            <div class="exercise-type" id="type"></div>
            <h2 class="exercise-name" id="name"></h2>
            <div class="exercise-reps" id="reps"></div>
            <div class="note-box"      id="note"></div>
        </div>

        <div id="video-section" aria-label="Exercise video">
            <div id="video-loader" class="video-loader" role="status"></div>
            <div id="video-embed">
                <iframe id="yt-iframe" src="" frameborder="0" title="Exercise video"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen loading="lazy"></iframe>
                <a id="yt-fallback"       href="#" target="_blank" rel="noopener" class="yt-fallback-link"></a>
                <a id="yt-fallback-below" href="#" target="_blank" rel="noopener" class="yt-fallback-link" style="display:none;"></a>
            </div>
        </div>
    </div>

    <!-- STICKY NEXT BUTTON -->
    <button class="main-btn" id="txt-next" onclick="generateWorkout()"></button>

    <script src="js/data-fr.js"></script>
    <script src="js/data-en.js"></script>
    <script src="js/app.js"></script>

<!-- HappyBein backlink -->
