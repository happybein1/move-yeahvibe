<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout YeahVibe</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TXTCCH1ZGY"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-TXTCCH1ZGY');
    </script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- TOP BAR — workout screen only -->
    <div id="top-bar">
        <button class="change-btn" id="txt-change" onclick="clearMode()"></button>
        <div class="lang-group">
            <button id="btn-fr" class="lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
            <button id="btn-en" class="lang-btn"        onclick="setLang('en')">🇬🇧 EN</button>
        </div>
    </div>

    <!-- LANG SWITCHER — selection screen only -->
    <div id="lang-switcher-home">
        <button id="btn-fr-home" class="lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
        <button id="btn-en-home" class="lang-btn"        onclick="setLang('en')">🇬🇧 EN</button>
    </div>

    <!-- SELECTION SCREEN -->
    <div id="selection-screen">
        <h2 id="txt-choose"></h2>
        <button class="mode-btn btn-intense" onclick="setMode('intense')">
            <span class="mode-icon">🔥</span>
            <span class="mode-title" id="txt-intense-title"></span>
            <span class="mode-desc"  id="txt-intense-desc"></span>
        </button>
        <button class="mode-btn btn-senior" onclick="setMode('senior')">
            <span class="mode-icon">🌿</span>
            <span class="mode-title" id="txt-senior-title"></span>
            <span class="mode-desc"  id="txt-senior-desc"></span>
        </button>
    </div>

    <!-- WORKOUT SCREEN -->
    <div id="workout-screen">

        <!-- Compact exercise card -->
        <div id="card">
            <!-- Top row: emoji+svg left, type+name+reps right -->
            <div class="card-top">
                <div class="card-visual">
                    <div class="emoji-display" id="emoji">⚡</div>
                    <img id="exercise-img" class="exercise-img" src="" alt="" style="display:none"/>
                    <div id="exercise-svg" class="exercise-svg"></div>
                </div>
                <div class="card-info">
                    <div class="exercise-type" id="type"></div>
                    <div class="exercise-name" id="name"></div>
                    <div class="exercise-reps" id="reps"></div>
                </div>
            </div>

            <!-- Collapsible description -->
            <div class="desc-toggle" id="desc-toggle" onclick="toggleDesc()">
                <span id="txt-desc-label"></span>
                <span class="desc-arrow" id="desc-arrow">▼</span>
            </div>
            <div class="desc-body" id="desc-body">
                <div class="desc-text"  id="desc"></div>
                <div class="note-box"   id="note"></div>
            </div>
        </div>

        <!-- Video — right below the card -->
        <div id="video-section">
            <div id="video-loader" class="video-loader"></div>
            <div id="video-embed">
                <iframe id="yt-iframe" src="" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>
                <a id="yt-fallback"       href="#" target="_blank" class="yt-fallback-link"></a>
                <a id="yt-fallback-below" href="#" target="_blank" class="yt-fallback-link" style="display:none;"></a>
            </div>
        </div>

        <button class="main-btn" id="txt-next" onclick="generateWorkout()"></button>
    </div>

    <script src="js/data-fr.js"></script>
    <script src="js/data-en.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
